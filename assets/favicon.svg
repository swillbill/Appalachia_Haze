<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hand-drawn Paper Disc -->
  <circle cx="32" cy="32" r="30" fill="#f5efe4" stroke="#221c17" stroke-width="2.5" stroke-dasharray="80 2 60 1"/>
  
  <!-- Hand-drawn Mountain Ridges -->
  <path d="M10 46 L24 26 L36 38 L44 28 L54 46" fill="none" stroke="#221c17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mountain hatching -->
  <line x1="24" y1="29" x2="21" y2="44" stroke="#8c7a65" stroke-width="1.5"/>
  <line x1="27" y1="33" x2="26" y2="44" stroke="#8c7a65" stroke-width="1.5"/>
  <line x1="44" y1="31" x2="42" y2="45" stroke="#8c7a65" stroke-width="1.5"/>

  <!-- Hand-drawn 5-String Banjo -->
  <circle cx="32" cy="22" r="9" fill="#fdfaf3" stroke="#221c17" stroke-width="2.2"/>
  <circle cx="32" cy="22" r="6" fill="#c67d28" opacity="0.35"/>
  <line x1="32" y1="31" x2="32" y2="52" stroke="#221c17" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Banjo frets / brackets -->
  <line x1="29" y1="38" x2="35" y2="38" stroke="#221c17" stroke-width="1.5"/>
  <line x1="29" y1="44" x2="35" y2="44" stroke="#221c17" stroke-width="1.5"/>
  <!-- 5th string peg -->
  <circle cx="35" cy="40" r="1.5" fill="#221c17"/>
</svg>
